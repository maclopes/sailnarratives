# Other names of the game's areas and waters, used by the workbench's game report so that
# "Tejo", "Tagus estuary" or "Tagus between Abrantes and Azambuja" count as the river itself,
# not as a missing place. Author data for the sailing pack.
areas:
  tejo: [Tejo, Tagus, Rio Tejo, River Tagus, Rio de Lisboa, Estuário do Tejo, Tagus estuary, Baixo Tejo, Lower Tagus, Foz do Tejo, Tagus mouth]
  medio: [Médio Tejo, Middle Tagus, Tejo, Tagus, Rio Tejo, Alto Tejo, Upper Tagus]
  oeste: [Oeste]
  aveiro: [Ria de Aveiro, Ria]
  arcachon: [Bassin d'Arcachon, Arcachon Bay]
  pasaia: [Pasaia, Pasajes, Pasaia bay]
  azores: [Açores, Azores]
  madeira: [Madeira]
# Other names of the game's places (English exonyms and older spellings), so a line written for
# "Lisbon" plays at the game's port "Lisboa".
places:
  Lisboa: [Lisbon, Lisbonne, Porto de Lisboa, Port of Lisbon, Ribeira de Lisboa, Lisbon harbour]
  Setúbal: [Setubal]
  Almada: [Cacilhas]
# Boat names: generic words in front of a type ("Barco Moliceiro" = Moliceiro, "boat Catraio" =
# Catraio; "barco de água acima" keeps its "barco", which is part of the name), and other names
# of one type.
boat_words: [barco, barcos, boat, boats, embarcação, embarcações]
boats:
  Vapor: [steamboat, steamer, steamship, barco a vapor, steam boat, passenger steamer, steam passenger boat, steam cargo boat, company steamer]
