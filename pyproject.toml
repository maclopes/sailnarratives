[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagus-narrative"
version = "0.1.0"
description = "Offline pipeline that grounds, verifies and exports narrative lines for the Tagus sailing game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
tagus-validate = "tagus_narrative.validate:main"
tagus-linkcheck = "tagus_narrative.linkcheck:main"

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.setuptools.package-data]
tagus_narrative = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipeline/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline/src"]
